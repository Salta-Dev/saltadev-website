{% load static %}
<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SaltaDev - Publicar propuesta</title>
  {% include "includes/head.html" %}
  <link rel="stylesheet" href="{% static 'assets/css/base.css' %}">
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex overflow-x-hidden selection:bg-primary selection:text-white font-display">
  {% include "dashboard/includes/sidebar.html" %}
  {% include "dashboard/includes/mobile_menu.html" %}
  <main class="flex-1 lg:ml-72 flex flex-col min-h-screen overflow-y-auto relative bg-background-dark">
    <div class="flex-1 flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="bg-surface-dark rounded-2xl border border-[#342d2d] p-6 text-center">
          <h2 class="text-xl font-bold text-white mb-2">Publicar propuesta</h2>
          <p class="text-[#8e8584] text-sm mb-6">
            ¿Publicar <strong class="text-white">«{{ proposal_title }}»</strong> en Recursos?
          </p>
          <div class="flex gap-3 justify-center">
            <a href="{% url 'pending_resource_proposals' %}" class="px-6 py-3 rounded-xl bg-[#2a2424] hover:bg-[#3d3434] text-white text-sm font-bold transition-all border border-[#3d2f2f]">Cancelar</a>
            <form action="{{ action_url }}" method="post" class="inline">
              {% csrf_token %}
              <button type="submit" class="px-6 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white text-sm font-bold transition-all">Publicar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
